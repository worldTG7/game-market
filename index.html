async function doPublish(title, price, server) {
  const overlay = document.getElementById('publishOverlay');
  const itemId = 'item_'+Date.now();
  const branch = toBranchName(currentUser.username);

  // Show progress bar in overlay
  const progressEl = document.getElementById('overlayProgress');
  const progressText = document.getElementById('overlayProgressText');
  const progressFill = document.getElementById('overlayProgressFill');
  progressEl.classList.add('show');

  // Upload media files separately
  const mediaRefs = [];
  const totalFiles = uploadedMedia.length;

  try {
    for (let i = 0; i < uploadedMedia.length; i++) {
      const m = uploadedMedia[i];
      if (m.file) {
        const ext = m.name.split('.').pop().toLowerCase();
        const filename = `${itemId}_${i}.${ext}`;

        let compressedUrl = null;
        let thumbnail = null;

        if (m.type === 'image') {
          // Compress image + read original in parallel
          progressText.textContent = `处理图片 ${i + 1}/${totalFiles}...`;
          progressFill.style.width = Math.round(((i + 0.2) / totalFiles) * 100) + '%';

          // 并行：压缩缩略图 + 读取原图base64
          const [thumbResult, origBase64] = await Promise.all([
            compressImage(m.file).then(b => fileToBase64(b)).catch(e => {
              console.warn('Compression failed:', e);
              return fileToBase64(m.file);
            }),
            fileToBase64(m.file)
          ]);
          const thumbDataUrl = thumbResult;

          // Upload original as backup
          const origContent = origBase64.split(',')[1];
          const origFilename = `${itemId}_${i}_orig.${ext}`;
          await ghWriteBinaryFile(branch, 'media/'+origFilename, origContent, '备份原图: '+origFilename);
          progressFill.style.width = Math.round(((i + 0.9) / totalFiles) * 100) + '%';

          // Store base64 data URL directly — no external fetch needed to display
          mediaRefs.push({
            type: 'image',
            filename: origFilename,
            url: thumbDataUrl,    // base64 data URL, loads instantly
            thumbnail: null
          });
        }

        if (m.type === 'video') {
          // Generate thumbnail + read video in parallel
          progressText.textContent = `处理视频 ${i + 1}/${totalFiles}...`;
          progressFill.style.width = Math.round(((i + 0.1) / totalFiles) * 100) + '%';

          const [thumbDataUrl, base64] = await Promise.all([
            generateVideoThumbnail(m.preview),
            fileToBase64(m.file)
          ]);

          // Upload original video as backup
          progressText.textContent = `上传视频 ${i + 1}/${totalFiles}...`;
          const base64Content = base64.split(',')[1];
          await ghWriteBinaryFile(branch, 'media/'+filename, base64Content, '上传视频: '+filename);
          progressFill.style.width = Math.round(((i + 0.9) / totalFiles) * 100) + '%';

          // Store base64 thumbnail directly in JSON
          mediaRefs.push({
            type: 'video',
            filename: filename,
            url: thumbDataUrl,     // base64 thumbnail, loads instantly
            thumbnail: thumbDataUrl
          });
        }

        // Update progress to completed
        const completedProgress = Math.round(((i + 1) / totalFiles) * 100);
        progressFill.style.width = completedProgress + '%';
      }
    }

    // Hide progress after upload
    progressText.textContent = '媒体文件上传完成';
    progressFill.style.width = '100%';
    setTimeout(() => progressEl.classList.remove('show'), 1500);

  } catch(e) {
    progressText.textContent = '上传失败: ' + e.message;
    progressFill.style.width = '100%';
    progressFill.style.background = '#e74c3c';
    showToast('❌ 媒体上传失败: ' + e.message, 'error');
    setTimeout(() => {
      progressEl.classList.remove('show');
      progressFill.style.background = '';
    }, 3000);
    return;
  }

  // Create item with media references (not base64 data)
  const wechat = document.getElementById('fWechat').value.trim() || '无';
  const priceType = document.getElementById('fPriceType').value || 'rmb';
  const item = {
    id: itemId,
    title,
    price,
    priceType,
    wechat,
    server,
    category:'',
    game:'',
    desc:title,
    media: mediaRefs,
    tags:[],
    likes: 0,
    time: new Date().toISOString()
  };

  myItems.unshift(item);
  resetForm();
  showToast('✅ 发布成功！数据同步需要1-3分钟，请耐心等待','success');

  // 媒体已上传完毕、本地数据已更新，立即解除遮罩
  window._publishing = false;
  overlay.classList.remove('show');

  // 后台同步，不阻塞用户
  saveItem(item).catch(e => showToast('保存失败: '+e.message,'error'));
  renderMyItems();
  loadAllItems();
}

// 防抖定时器
let syncTimer = null;

// Like item - 立即更新本地 + 防抖同步远端
function likeItem() {
  if (!currentItem) return;

  // 本地累积
  pendingLikes++;
  currentItem.likes = (currentItem.likes || 0) + 1;

  // 标记为本次会话中本地点赞过的道具
  locallyLikedItems.add(currentItem.id);

  // 立即更新 UI
  const likeBtnEl = document.querySelector('.like-btn');
  const likeCountEl = document.querySelector('.like-btn .like-count');

  if (likeCountEl) {
    likeCountEl.textContent = currentItem.likes;

    // 数字弹跳动画
    likeCountEl.classList.remove('bump');
    void likeCountEl.offsetWidth; // 强制重排
    likeCountEl.classList.add('bump');
    setTimeout(() => likeCountEl.classList.remove('bump'), 300);
  }

  // 按钮弹跳动画 + 背景高亮
  if (likeBtnEl) {
    likeBtnEl.classList.remove('animating');
    void likeBtnEl.offsetWidth;
    likeBtnEl.classList.add('animating');
    setTimeout(() => likeBtnEl.classList.remove('animating'), 500);

    // 创建飘散的爱心粒子
    spawnLikeParticles(likeBtnEl);
  }

  // 更新本地数据
  const localItem = allItems.find(it => it.id === currentItem.id);
  if (localItem) localItem.likes = currentItem.likes;

  // 立即更新 localStorage 缓存
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const cacheData = JSON.parse(cached);
      const cachedItem = cacheData.items.find(it => it.id === currentItem.id);
      if (cachedItem) {
        cachedItem.likes = currentItem.likes;
        localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
      }
    }
  } catch(e) { /* ignore cache errors */ }

  // 防抖：2秒后同步到远端（快速点击只触发一次）
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(syncLikes, 2000);
}

// 生成飘散的爱心粒子
function spawnLikeParticles(btnEl) {
  const rect = btnEl.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const hearts = ['❤️', '💕', '💖', '💗', '✨', '🌟'];

  for (let i = 0; i < 6; i++) {
    const particle = document.createElement('div');
    particle.className = 'like-particle';
    particle.textContent = hearts[Math.floor(Math.random() * hearts.length)];

    // 随机方向
    const angle = (Math.random() - 0.5) * Math.PI; // -90° 到 90°
    const distance = 60 + Math.random() * 40;
    const tx = Math.sin(angle) * distance;
    const ty = -Math.cos(angle) * distance - 20; // 向上飘
    const rot = (Math.random() - 0.5) * 360;

    particle.style.left = centerX + 'px';
    particle.style.top = centerY + 'px';
    particle.style.setProperty('--tx', tx + 'px');
    particle.style.setProperty('--ty', ty + 'px');
    particle.style.setProperty('--rot', rot + 'deg');

    document.body.appendChild(particle);

    // 动画结束后移除
    setTimeout(() => particle.remove(), 1000);
  }
}

// 同步点赞数到远程（读取远端最新值 + 累加本地增量，避免覆盖冲突）
async function syncLikes() {
  if (!currentItem || pendingLikes <= 0) {
    pendingLikes = 0;
    return;
  }

  const likesToSync = pendingLikes;
  pendingLikes = 0;
  const itemId = currentItem.id;
  const ownerBranch = currentItem._owner;
  if (!ownerBranch) return;

  try {
    // 1. 直接从 GitHub API 读取最新数据（绕过 CDN 缓存）
    const remoteData = await ghReadFileDirect(ownerBranch, 'data/'+itemId+'.json');
    if (!remoteData) { console.warn('远端道具不存在'); return; }

    // 2. 累加本地增量到远端最新值
    const remoteLikes = remoteData.likes || 0;
    const newLikes = remoteLikes + likesToSync;
    remoteData.likes = newLikes;

    // 3. 写回远端
    await ghWriteFile(ownerBranch, 'data/'+itemId+'.json', remoteData, '点赞+'+likesToSync+': '+remoteData.title);
    console.log('✅ 点赞已同步: 远端'+remoteLikes+' + 本地'+likesToSync+' = '+newLikes);

    // 4. 更新本地数据为远端最新值
    currentItem.likes = newLikes;
    const localItem = allItems.find(it => it.id === itemId);
    if (localItem) localItem.likes = newLikes;

    // 5. 更新本地缓存
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const cacheData = JSON.parse(cached);
        const cachedItem = cacheData.items.find(it => it.id === itemId);
        if (cachedItem) {
          cachedItem.likes = newLikes;
          localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
        }
      }
    } catch(e) { /* ignore */ }

    // 异步更新主索引
    updateMainIndex().catch(e => console.warn('Index update failed:', e));
  } catch(e) {
    // 失败时把增量加回 pending，下次重试
    pendingLikes += likesToSync;
    console.warn('Sync likes failed:', e.message);
  }
}

// Helper: convert File to base64 data URL
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Generate compressed video thumbnail
function generateVideoThumbnail(videoUrl) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.crossOrigin = 'anonymous';
    video.muted = true;
    video.playsInline = true;

    video.addEventListener('loadeddata', () => {
      video.currentTime = 0.1;
    });

    video.addEventListener('seeked', () => {
      // Moderate compression: 640px width, good quality
      const maxWidth = 640;
      let width = video.videoWidth;
      let height = video.videoHeight;
      if (width > maxWidth) {
        height = Math.round(height * maxWidth / width);
        width = maxWidth;
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);
      try {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        resolve(dataUrl);
      } catch(e) {
        console.warn('Thumbnail generation failed:', e);
        resolve(null);
      }
    });

    video.addEventListener('error', () => {
      console.warn('Video load failed for thumbnail');
      resolve(null);
    });

    video.src = videoUrl;
  });
}

// Compress video using MediaRecorder (if supported)
async function compressVideo(file, maxWidth = 480, bitrate = 300000) {
  return new Promise(async (resolve, reject) => {
    try {
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.src = URL.createObjectURL(file);

      await new Promise((res, rej) => {
        video.onloadedmetadata = res;
        video.onerror = rej;
      });

      // Calculate new dimensions
      let width = video.videoWidth;
      let height = video.videoHeight;
      if (width > maxWidth) {
        height = Math.round(height * maxWidth / width);
        width = maxWidth;
      }

      // Create canvas for re-encoding
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const stream = canvas.captureStream(30); // 30fps
      const recorder = new MediaRecorder(stream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: bitrate
      });

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        URL.revokeObjectURL(video.src);
        resolve(blob);
      };

      video.ontimeupdate = () => {
        ctx.drawImage(video, 0, 0, width, height);
      };

      video.onended = () => {
        recorder.stop();
      };

      recorder.start();
      video.currentTime = 0;
      await video.play();

      // Seek through video to trigger drawing
      const duration = video.duration;
      const step = 1/30;
      for (let t = 0; t <= duration; t += step) {
        await new Promise(res => setTimeout(res, 10));
      }
      video.pause();
      video.onended();
    } catch(e) {
      console.warn('Video compression failed, using original:', e);
      resolve(file);
    }
  });
}

// Compress image for base64 embedding (balance quality vs size)
async function compressImage(file, maxWidth = 800, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);

      // Calculate new dimensions
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height = Math.round(height * maxWidth / width);
        width = maxWidth;
      }

      // Create canvas and compress
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Compression settings
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, width, height);

      // Try WebP first (25-35% smaller), fallback to JPEG
      canvas.toBlob(
        (blob) => {
          if (blob && blob.type === 'image/webp') {
            resolve(blob);
          } else {
            // Fallback to JPEG
            canvas.toBlob(
              (jpegBlob) => {
                if (jpegBlob) {
                  resolve(jpegBlob);
                } else {
                  reject(new Error('压缩失败'));
                }
              },
              'image/jpeg',
              quality
            );
          }
        },
        'image/webp',
        quality
      );
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('图片加载失败'));
    };

    img.src = url;
  });
}

// Generate blur placeholder (tiny, ~1-2KB)
function generateBlurPlaceholder(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement('canvas');
      canvas.width = 20; // Tiny size for blur
      canvas.height = 15;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'low';
      ctx.drawImage(img, 0, 0, 20, 15);

      canvas.toBlob(
        (blob) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        },
        'image/jpeg',
        0.2
      );
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(null);
    };

    img.src = url;
  });
}

async function deployToGitHub() {
  if(!currentUser){showToast('请先登录','error');return;}
  if(!(await validateSession())) return;

  const branch = toBranchName(currentUser.username);
  try {
    // Step 1: Prepare share parameters
    setStep(1,'active', deployMode === 'item' ? '准备分享单品...' : '准备分享主页...');
    let urlParam = '';
    if (deployMode === 'item' && deployItemId) {
      // Single item mode - verify item exists
      const item = allItems.find(it => it.id === deployItemId) || myItems.find(it => it.id === deployItemId);
      if (!item) throw new Error('道具不存在');
      urlParam = '?item=' + encodeURIComponent(deployItemId);
      setStep(1,'done','单品分享准备完成');
    } else if (deployMode === 'user' && deployItemId) {
      // User page mode - deployItemId contains the branch name (username)
      urlParam = '?user=' + encodeURIComponent(deployItemId);
      setStep(1,'done','用户主页分享准备完成');
    } else {
      // Homepage mode
      if(!myItems.length) throw new Error('没有可分享的道具');
      urlParam = '?user=' + encodeURIComponent(currentUser.username);
      setStep(1,'done','主页分享准备完成');
    }

    // Step 2: Ensure repo & user branch exists
    setStep(2,'active','检查仓库...');
    await ghEnsureRepo();
    if(!(await ghBranchExists(branch))) {
      await ghCreateBranch(branch);
      await sleep(1500);
    }
    setStep(2,'done','仓库已就绪');

    // Step 3: Always update HTML to main branch to ensure latest version
    setStep(3,'active','更新应用代码...');
    const defaultBranch = await ghDefaultBranch();

    // Hide deploy modal temporarily during HTML capture (no DOM manipulation to avoid flashing)
    const deployOverlay = document.getElementById('deployModalOverlay');
    const originalDisplay = deployOverlay.style.display;
    deployOverlay.style.display = 'none';

    let rawHtml = document.documentElement.outerHTML;

    // Restore deploy modal visibility
    deployOverlay.style.display = originalDisplay;

    const blob = await ghPost(`/repos/${GH.owner}/${GH.repo}/git/blobs`, {
      content: rawHtml, encoding: 'utf-8'
    });

    const mainRef = await ghGet(`/repos/${GH.owner}/${GH.repo}/git/refs/heads/${defaultBranch}`);
    const currentCommit = await ghGet(`/repos/${GH.owner}/${GH.repo}/git/commits/${mainRef.object.sha}`);
    const currentTree = currentCommit.tree.sha;

    const newTree = await ghPost(`/repos/${GH.owner}/${GH.repo}/git/trees`, {
      base_tree: currentTree,
      tree: [{
        path: 'index.html',
        mode: '100644',
        type: 'blob',
        sha: blob.sha
      }]
    });

    const newCommit = await ghPost(`/repos/${GH.owner}/${GH.repo}/git/commits`, {
      message: '更新应用代码 ' + new Date().toLocaleString('zh-CN'),
      tree: newTree.sha,
      parents: [mainRef.object.sha]
    });

    await ghFetch(`/repos/${GH.owner}/${GH.repo}/git/refs/heads/${defaultBranch}`, {
      method: 'PATCH',
      body: JSON.stringify({ sha: newCommit.sha })
    });

    setStep(3,'done','应用代码已更新');

    // Step 4: Enable Pages from main branch (if not already enabled)
    setStep(4,'active','检查 GitHub Pages...');
    await ghEnablePagesFromMain();
    setStep(4,'done','GitHub Pages 已就绪');

    // Step 5: Generate link
    setStep(5,'active','生成链接...');
    currentShareUrl = `https://${GH.owner.toLowerCase()}.github.io/${GH.repo}/${urlParam}`;
    setStep(5,'done','链接已生成');

    document.getElementById('deployProgress').style.display='none';
    const resultEl=document.getElementById('deployResult');
    const urlEl=document.getElementById('deployUrl');
    urlEl.textContent=currentShareUrl;
    resultEl.style.display='block';

  } catch(err) {
    console.error('Deploy error:',err);
    const active=document.querySelector('.deploy-step.active');
    if(active) { const n=active.id.replace('step',''); setStep(parseInt(n),'error',err.message); }
    else showToast('部署失败: '+err.message,'error');
  }
}

async function ghEnablePagesFromMain() {
  const def = await ghDefaultBranch();
  try {
    const pages = await ghGet(`/repos/${GH.owner}/${GH.repo}/pages`);
    // If it exists but uses wrong branch/path, update it
    if (pages.source && (pages.source.branch !== def || pages.source.path !== '/')) {
      await ghPut(`/repos/${GH.owner}/${GH.repo}/pages`, {source: {branch: def, path: '/'}});
    }
  } catch {
    // Pages doesn't exist, create it
    try {
      await ghPost(`/repos/${GH.owner}/${GH.repo}/pages`, {source: {branch: def, path: '/'}});
    } catch {}
  }
}

</head><body>
<header class="header"><h1>🎮 ${esc(ownerName)} 的世界online</h1><div class="header-sub">${items.length} 个道具</div></header>
<div class="card-grid" id="grid"></div>
<div class="modal-overlay" id="ov" onclick="cm(event)">
<div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><button class="modal-close" onclick="cm()">✕</button><div class="modal-media" id="mm"></div><div class="modal-info" id="mi"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="cm()">关闭</button></div></div>
</div>
<script>
var items=${JSON.stringify(items)};var mi2=0,ci=null;
function render(){var g=document.getElementById('grid'),h='';items.forEach(function(it,i){var th=it.media&&it.media.length?(it.media[0].type==='image'?'<img class="card-thumb" src="'+it.media[0].data+'" loading="lazy">':'<video class="card-thumb" src="'+it.media[0].data+'" muted preload="metadata"></video>'):'<div class="card-thumb-placeholder">🎮</div>';h+='<div class="card" onclick="op('+i+')">'+th+'<div class="card-body"><div class="card-title">'+e2(it.title)+'</div><div class="card-price '+(it.priceType||'rmb')+'"><span class="price-num">'+it.price+'</span></div><div class="card-tags"><span class="tag heat">'+e2(it.category)+'</span>'+(it.game?'<span class="tag">'+e2(it.game)+'</span>':'')+'</div><div class="card-meta-row">'+(it._owner?'<span class="card-meta-owner">'+e2(it._owner)+'</span>':'')+(it.time?'<span class="card-meta-time">'+it.time+'</span>':'')+'</div></div></div>';});g.innerHTML=h;}
function op(i){ci=items[i];mi2=0;rm();document.getElementById('mi').innerHTML='<div class="modal-title">'+e2(ci.title)+'</div><div class="modal-price '+(ci.priceType||'rmb')+'">'+ci.price+'</div><div class="modal-desc">'+e2(ci.desc)+'</div><div class="modal-meta"><span class="meta-chip">'+e2(ci.category)+'</span>'+(ci.game?'<span class="meta-chip">🎮 '+e2(ci.game)+'</span>':'')+(ci.time?'<span class="meta-chip">📅 '+ci.time+'</span>':'')+(ci._owner?'<span class="meta-chip">👤 '+e2(ci._owner)+'</span>':'')+(ci.tags||[]).map(function(t){return'<span class="meta-chip">'+e2(t)+'</span>';}).join('')+'</div>';document.getElementById('ov').classList.add('show');document.body.style.overflow='hidden';}
function rm(){var el=document.getElementById('mm'),m=ci.media;if(!m||!m.length){el.innerHTML='<div style="color:#6b7084;font-size:3rem">🎮</div>';return;}var d=m[mi2],h=d.type==='image'?'<img src="'+d.data+'">':'<video src="'+d.data+'" controls playsinline></video>';if(m.length>1){h+='<button class="media-arrow left" onclick="nv(-1)">‹</button><button class="media-arrow right" onclick="nv(1)">›</button><div class="media-nav">';m.forEach(function(_,i){h+='<button class="media-dot'+(i===mi2?' active':'')+'" onclick="go('+i+')"></button>';});h+='</div>';}el.innerHTML=h;}
function nv(d){var l=ci.media.length;mi2=(mi2+d+l)%l;rm();}
function go(i){mi2=i;rm();}
function cm(ev){if(ev&&ev.target!==document.getElementById('ov'))return;document.getElementById('ov').classList.remove('show');document.body.style.overflow='';var v=document.querySelector('.modal-media video');if(v)v.pause();}
function e2(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
render();
<\/script></body></html>`;
}

// ================================================================
// INIT
// ================================================================
(async function init() {
  // 推入哨兵状态，防止微信左滑直接退出
  history.pushState({sentinel:true}, '');

  // Check URL parameters for initial view
  const urlParams = new URLSearchParams(window.location.search);
  const itemParam = urlParams.get('item');
  const userParam = urlParams.get('user');

  // Start as guest (all pages have full functionality)
  isGuest = true;
  updateHeader();
  document.getElementById('headerSub').textContent = '免费分享，请勿上传隐私信息';
  updateUploadPanel();
  // Don't call renderEveryonePanel/renderMinePanel here - HTML already has loading indicators
  // They will be called when data loads in loadAllItems()

  const ls = document.getElementById('loadingScreen');

  // Sync index to main branch (background, non-blocking)
  updateMainIndex().catch(e => console.warn('Index sync failed:', e));

  if (itemParam || userParam) {
    // 有 URL 参数时，必须先加载完数据再展示，加载界面保持显示
    await loadAllItems().catch(e => console.warn('Load items failed:', e));
    if (itemParam) {
      openDetailById(itemParam);
    } else if (userParam) {
      switchTab('everyone');
      viewUserPage(toBranchName(userParam));
    }
    // 数据加载完成，淡出加载界面
    if (ls) {
      ls.classList.add('fade-out');
      setTimeout(() => ls.remove(), 400);
    }
  } else {
    // 无 URL 参数，立即淡出加载界面，后台加载数据
    if (ls) {
      ls.classList.add('fade-out');
      setTimeout(() => ls.remove(), 400);
    }
    loadAllItems().catch(e => console.warn('Background load failed:', e));
  }

  // Check saved session and validate
  const saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) {
    try {
      const branch = toBranchName(saved);
      const exists = await ghBranchExists(branch);
      if (!exists) {
        console.warn('Saved session invalid: branch deleted');
        sessionStorage.removeItem(SESSION_KEY);
        return;
      }
      const raw = await ghReadRaw(branch, '.ttt');
      if (!raw) {
        console.warn('Saved session invalid: account file missing');
        sessionStorage.removeItem(SESSION_KEY);
        return;
      }
      await enterApp(saved);
    } catch(e) {
      console.warn('Auto-login validation failed:', e);
      sessionStorage.removeItem(SESSION_KEY);
    }
  }
})();
</script>
</body>
</html>
